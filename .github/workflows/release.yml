name: CLI releases
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish checked CLI packages to GitHub Releases and CDN
        type: boolean
        default: false
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: cli-packages-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4
jobs:
  checks:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check release tooling with real Ed25519 signatures
        run: |
          set -euo pipefail
          openssl version | grep '^OpenSSL 3\.'
          python -m unittest discover -s tests -p 'test_release*.py'
  build:
    if: ${{ !github.event.repository.private }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            binary: ghost
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            binary: ghost.exe
          - os: macos-15
            target: aarch64-apple-darwin
            binary: ghost
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: ghost
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TARGET: ${{ matrix.target }}
      RELEASE_BINARY: ${{ matrix.binary }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools cmake pkg-config build-essential
      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.0 --profile minimal --component clippy,rustfmt --target "$RELEASE_TARGET"
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: cli-${{ matrix.target }}-rust-1.97-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Check workspace and API feature sets on the native target
        run: |
          set -euo pipefail
          cargo fmt -- --check
          cargo clippy --locked --workspace --all-targets --all-features --target "$RELEASE_TARGET" -- -D warnings
          cargo test --locked --workspace --target "$RELEASE_TARGET"
          cargo test --locked -p ghostrack-client-api --no-default-features --target "$RELEASE_TARGET"
          cargo test --locked -p ghostrack-client-api --all-features --target "$RELEASE_TARGET"
      - name: Build and check native release archive
        run: |
          set -euo pipefail
          cargo build --locked --release --bin ghost --target "$RELEASE_TARGET"
          python scripts/package-release.py --target "$RELEASE_TARGET" \
            --binary "target/$RELEASE_TARGET/release/$RELEASE_BINARY" \
            --output "artifacts/packages/$RELEASE_TARGET"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: artifacts/packages/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 30
  publish:
    if: ${{ !github.event.repository.private && (startsWith(github.ref, 'refs/tags/v') || inputs.publish) }}
    needs: [checks, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: cli-release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-*-*'
          path: artifacts/downloads
      - name: Publish identical checked packages to both destinations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CDN_STORAGE_PASSWORD: ${{ secrets.CDN_STORAGE_PASSWORD }}
          CDN_STORAGE_ENDPOINT: ${{ vars.CDN_STORAGE_ENDPOINT }}
          CDN_STORAGE_ZONE: ${{ vars.CDN_STORAGE_ZONE }}
          CDN_PUBLIC_BASE: ${{ vars.CDN_PUBLIC_BASE }}
          CLI_RELEASE_SIGNING_KEY: ${{ secrets.CLI_RELEASE_SIGNING_KEY }}
        run: python scripts/publish-release.py --packages artifacts/downloads
